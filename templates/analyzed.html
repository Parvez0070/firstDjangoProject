<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyzed Text</title>


<style>
/* GENERAL */
body {
    background: #0f172a;
    color: white;
    font-family: 'Segoe UI', sans-serif;
    padding: 20px;
    line-height: 1.6;
}

/* HEADER FLEX */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.header h1 {
    font-size: 28px;
    color: #f1f5f9;
    margin: 0;
}

.header h1 span {
    font-size: 0.6em;
    color: #d97706; /* brownish accent */
}

/* BACK BUTTON */
.back-btn {
    padding: 10px 20px;
    background: #4facfe;
    color: white;
    border-radius: 8px;
    text-decoration: none;
    transition: 0.3s;
    white-space: nowrap;
}

.back-btn:hover {
    transform: scale(1.05);
    background: #00f2fe;
}

/* RESULT BOX */
pre {
    background: #f8f9fb;
    padding: 20px;
    border-radius: 12px;
    max-width: 90%;
    overflow-x: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 16px;
    color: #010913;
    box-shadow: 0 5px 15px rgba(109, 9, 209, 0.3);
    transition: 0.3s;
}

pre:hover {
    transform: scale(1.02);
    background: #bcd1f0;
}
</style>
</head>



<body>

<div class="header">
    <h1>
        Analyzed Text for <span>{{ purpose }}</span>
    </h1>
    <a href="/" class="back-btn">← Back to Analyzer</a>
</div>

<pre>{{ analyzed_text }}</pre>

</body>
</html>
